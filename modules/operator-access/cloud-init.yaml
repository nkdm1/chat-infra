#cloud-config
package_update: true
package_upgrade: false
packages:
  - ansible-core
  - ca-certificates
  - curl
  - git
  - gnupg
  - jq
  - lsb-release
  - postgresql-client
  - python3-cryptography
  - python3-kubernetes
  - python3-pip
  - python3-psycopg2
  - python3-venv

runcmd:
  - |
    set -eu
    tmpdir=$(mktemp -d)
    trap 'rm -rf "$tmpdir"' 0

    # Refresh the system trust store before fetching third-party repository keys.
    DEBIAN_FRONTEND=noninteractive apt-get update
    DEBIAN_FRONTEND=noninteractive apt-get install -y ca-certificates curl gnupg
    update-ca-certificates --fresh
    test -s /etc/ssl/certs/ca-certificates.crt

    install -d -m 0755 /etc/apt/keyrings
    curl --fail --show-error --location --retry 5 --retry-all-errors --retry-delay 2 \
      --connect-timeout 20 --max-time 120 \
      --output "$tmpdir/microsoft.asc" https://packages.microsoft.com/keys/microsoft.asc
    gpg --dearmor --yes -o /etc/apt/keyrings/microsoft.gpg "$tmpdir/microsoft.asc"
    chmod 0644 /etc/apt/keyrings/microsoft.gpg
    . /etc/os-release
    echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/microsoft.gpg] https://packages.microsoft.com/repos/azure-cli/ ${VERSION_CODENAME} main" \
      > /etc/apt/sources.list.d/azure-cli.list

    apt-get update
    DEBIAN_FRONTEND=noninteractive apt-get install -y azure-cli

    # Install a pinned official Helm release and verify its published checksum.
    helm_version=v3.22.1
    helm_archive="helm-${helm_version}-linux-amd64.tar.gz"
    curl --fail --show-error --location --retry 5 --retry-all-errors --retry-delay 2 \
      --connect-timeout 20 --max-time 180 \
      --output "$tmpdir/$helm_archive" "https://get.helm.sh/$helm_archive"
    curl --fail --show-error --location --retry 5 --retry-all-errors --retry-delay 2 \
      --connect-timeout 20 --max-time 60 \
      --output "$tmpdir/$helm_archive.sha256sum" "https://get.helm.sh/$helm_archive.sha256sum"
    (cd "$tmpdir" && sha256sum -c "$helm_archive.sha256sum")
    tar -xzf "$tmpdir/$helm_archive" -C "$tmpdir"
    install -m 0755 "$tmpdir/linux-amd64/helm" /usr/local/bin/helm

    az aks install-cli --only-show-errors
    git clone --depth 1 --branch main https://github.com/nkdm1/chat-infra.git /opt/chat-infra
