#cloud-config
package_update: true
package_upgrade: false
packages:
  - ansible-core
  - ca-certificates
  - curl
  - git
  - gnupg
  - jq
  - lsb-release
  - postgresql-client
  - python3-cryptography
  - python3-kubernetes
  - python3-pip
  - python3-psycopg2
  - python3-venv

runcmd:
  - |
    set -eu
    tmpdir=$(mktemp -d)
    trap 'rm -rf "$tmpdir"' 0

    install -d -m 0755 /etc/apt/keyrings
    curl -fsSL -o "$tmpdir/microsoft.asc" https://packages.microsoft.com/keys/microsoft.asc
    gpg --dearmor --yes -o /etc/apt/keyrings/microsoft.gpg "$tmpdir/microsoft.asc"
    chmod 0644 /etc/apt/keyrings/microsoft.gpg
    . /etc/os-release
    echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/microsoft.gpg] https://packages.microsoft.com/repos/azure-cli/ ${VERSION_CODENAME} main" \
      > /etc/apt/sources.list.d/azure-cli.list

    curl -fsSL -o "$tmpdir/helm-signing.asc" https://baltocdn.com/helm/signing.asc
    gpg --dearmor --yes -o /usr/share/keyrings/helm.gpg "$tmpdir/helm-signing.asc"
    chmod 0644 /usr/share/keyrings/helm.gpg
    echo "deb [arch=amd64 signed-by=/usr/share/keyrings/helm.gpg] https://baltocdn.com/helm/stable/debian/ all main" \
      > /etc/apt/sources.list.d/helm-stable-debian.list

    apt-get update
    DEBIAN_FRONTEND=noninteractive apt-get install -y azure-cli helm
    az aks install-cli --only-show-errors
    git clone --depth 1 --branch main https://github.com/nkdm1/chat-infra.git /opt/chat-infra
