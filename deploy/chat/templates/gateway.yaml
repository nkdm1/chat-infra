{{- if .Values.app.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: chat
  namespace: chat
spec:
  gatewayClassName: nginx
  infrastructure:
    annotations:
      service.beta.kubernetes.io/azure-pip-name: {{ required "gatewayPublicIpName is required" .Values.gatewayPublicIpName | quote }}
      service.beta.kubernetes.io/azure-load-balancer-resource-group: {{ required "gatewayPublicIpResourceGroup is required" .Values.gatewayPublicIpResourceGroup | quote }}
  listeners:
    - name: https
      hostname: {{ required "hostname is required" .Values.hostname | quote }}
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - name: {{ required "tlsSecretName is required" .Values.tlsSecretName | quote }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: chat
  namespace: chat
spec:
  parentRefs:
    - name: chat
      sectionName: https
  hostnames:
    - {{ .Values.hostname | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: chat
          port: 80
{{- end }}
