apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: chat-secrets
  namespace: chat
spec:
  provider: azure
  secretObjects:
    - secretName: chat-runtime
      type: Opaque
      data:
        - objectName: better-auth-secret
          key: BETTER_AUTH_SECRET
        - objectName: database-url
          key: DATABASE_URL
        - objectName: redis-url
          key: REDIS_URL
  parameters:
    clientID: {{ required "workloadClientId is required" .Values.workloadClientId | quote }}
    keyvaultName: {{ required "keyVaultName is required" .Values.keyVaultName | quote }}
    tenantId: {{ required "tenantId is required" .Values.tenantId | quote }}
    objects: |
      array:
        - |
          objectName: better-auth-secret
          objectType: secret
        - |
          objectName: database-url
          objectType: secret
        - |
          objectName: redis-url
          objectType: secret
