---
- name: Provision Redis and Better Auth runtime secrets
  hosts: operator
  gather_facts: false
  tasks:
    - name: Create runtime secrets once or preserve existing values
      ansible.builtin.command:
        argv:
          - python3
          - /opt/chat-infra/scripts/provision_runtime_secrets.py
      environment:
        APP_KEY_VAULT_NAME: "{{ lookup('env', 'APP_KEY_VAULT_NAME') }}"
        ARM_SUBSCRIPTION_ID: "{{ lookup('env', 'ARM_SUBSCRIPTION_ID') }}"
        REDIS_RESOURCE_GROUP: "{{ lookup('env', 'DEV_RESOURCE_GROUP') }}"
        REDIS_ENTERPRISE_NAME: "{{ lookup('env', 'REDIS_ENTERPRISE_NAME') }}"
        REDIS_HOSTNAME: "{{ lookup('env', 'REDIS_HOSTNAME') }}"
        REDIS_DATABASE_NAME: default
      register: runtime_secret_provisioning
      changed_when: "'stored' in runtime_secret_provisioning.stdout"
      no_log: true
